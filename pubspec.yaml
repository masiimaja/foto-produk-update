name: foto_produk_update
description: Prototipe aplikasi Android untuk membuat desain iklan produk dari satu atau banyak foto.
publish_to: 'none'
version: 0.4.1+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_foto_produk_update.png
